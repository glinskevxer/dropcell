[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dropcell"
version = "1.0.0"
description = "Cathodic protection monitoring and compliance for buried steel pipelines"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "glinskevxer" }]
dependencies = ["click==8.1.8"]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "coverage==7.6.12",
  "ruff==0.9.6",
  "mypy==1.15.0",
]

[project.scripts]
dropcell = "dropcell.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dropcell"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "N"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["src/dropcell"]
omit = ["*/tools/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The domain has records called TestPoint and TestPost. Collection by class
# name picks those up out of the modules that import them, so the pattern is
# narrowed to something no record will ever be called.
python_classes = ["Case*"]
